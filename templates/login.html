<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #060608;
    --surface: #0d0d10;
    --border:  #1e1a1a;
    --red:     #c0392b;
    --red2:    #e74c3c;
    --gold:    #d4a843;
    --pearl:   #e8e0d0;
    --text:    #ccc4b8;
    --muted:   #3d3530;
    --success: #7ec88a;
    --radius:  6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-gato {
    position: fixed; inset: 0;
    background: url('/static/gato_fondo.png') center center / cover no-repeat;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
    filter: grayscale(60%);
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(192,57,43,.005) 2px, rgba(192,57,43,.005) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(192,57,43,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(192,57,43,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 24px;
    animation: fadeIn .7s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: var(--pearl);
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 4px;
  }
  .logo span { color: var(--red); }

  .tagline {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--red);
    border-radius: var(--radius);
    padding: 32px;
  }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .flash {
    background: rgba(192,57,43,.08);
    border: 1px solid rgba(192,57,43,.25);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 12px;
    color: var(--red2);
    margin-bottom: 20px;
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: shake .4s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  .flash img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }

  label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--pearl);
    padding: 11px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    margin-bottom: 18px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--red); }
  .input-error { border-color: rgba(192,57,43,.5) !important; }

  .btn-login {
    width: 100%;
    background: var(--red);
    color: var(--pearl);
    border: none;
    border-radius: var(--radius);
    padding: 12px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }
  .btn-login:hover { background: var(--red2); transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }

  /* Overlay gato OK */
  .ok-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(6,6,8,.92);
    z-index: 9000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    animation: popIn .3s cubic-bezier(.16,1,.3,1);
  }
  .ok-overlay.show { display: flex; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  .ok-overlay img {
    width: 260px;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(192,57,43,.4);
  }

  .ok-overlay p {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--pearl);
    letter-spacing: 3px;
  }

  /* Easter eggs invisibles — SOLO en login */
  .easter1, .easter2 {
    position: fixed;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: #060608;
    letter-spacing: 2px;
    user-select: none;
    transition: color 1.5s ease;
    cursor: default;
  }
  .easter1 { bottom: 16px; right: 20px; }
  .easter2 { bottom: 16px; left: 20px; transition: color 1.5s ease, transform .4s ease; }
  .easter1:hover { color: rgba(192,57,43,.3); }
  .easter2:hover { color: rgba(192,57,43,.3); transform: rotate(-12deg); }
</style>
</head>
<body>

<div class="bg-gato"></div>
<div class="bg-grid"></div>

<div class="ok-overlay" id="okOverlay">
  <img src="/static/gato_ok.png" alt="ok">
  <p>ACCESO CONCEDIDO</p>
</div>

<div class="container">

  <div class="logo">SERVER <span>HUB</span></div>
  <div class="tagline">You are not alone // 1958 – 2009</div>

  <div class="card">
    <div class="card-title">// Identificación</div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
        <div class="flash">
          <img src="/static/gato_error.png" alt="error">
          <span>{{ msg }}</span>
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Usuario</label>
      <input type="text" name="username" placeholder="Ingresa tu usuario" autocomplete="off" required
        {% with messages = get_flashed_messages() %}{% if messages %}class="input-error"{% endif %}{% endwith %}>

      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••••••" required
        {% with messages = get_flashed_messages() %}{% if messages %}class="input-error"{% endif %}{% endwith %}>

      <button type="submit" class="btn-login">ENTRAR</button>
    </form>
  </div>

</div>

<!-- Easter eggs invisibles — exclusivos del login -->
<div class="easter1">021220CLA</div>
<div class="easter2">MJ·FOREVER·∞</div>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('ok') === '1') {
    const overlay = document.getElementById('okOverlay');
    overlay.classList.add('show');
    setTimeout(() => { window.location.href = '/'; }, 1800);
  }
</script>

</body>
</html>
